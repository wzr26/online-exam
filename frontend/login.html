<!DOCTYPE html>
<html>
<head>
    <title>Online Exam Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Online Exam</h1>

<form action="/login" method="POST">

    <label>Username</label>
    <input
        type="text"
        name="username"
    >

    <label>Password</label>
    <input
        type="password"
        name="password"
    >

    <button type="submit">
        Login
    </button>

</form>

</div>

</body>
</html>
